[project]
name = "langchain-docs-agent"
version = "0.1.0"
description = "LangChain docs Q&A Deep Agent (official docs MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.17,<2.0.0",
    "langchain-core>=1.3.2,<2.0.0",
    "langchain-openai>=1.2.1,<2.0.0",
    "langchain-anthropic>=1.2.1,<2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.0,<2.0.0",
    "deepagents>=0.4.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "pre-commit>=4.1.0",
    "langgraph-cli[inmem]>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_docs_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W292"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
